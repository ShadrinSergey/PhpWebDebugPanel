<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ProxyPreserveHost On

	RedirectMatch 302 ^/dbg$ /dbg/
	ProxyPass /dbg/css/ !
	ProxyPass /dbg/js/  !
	ProxyPass        /dbg/  http://127.0.0.1:8088/
	ProxyPassReverse /dbg/  http://127.0.0.1:8088/
	ProxyPassReverseCookiePath / /dbg/

	php_admin_value xdebug.mode debug
	php_admin_value xdebug.start_with_request "trigger"

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
